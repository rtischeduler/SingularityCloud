<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>FreezeNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app/style.css?v=2.0.0">
  <!-- Paint black immediately so there is never a white flash before the stylesheet loads -->
  <style>html,body{background:#000;margin:0}</style>
</head>
<body>

  <!-- Boot: session setup, then hands off to the app -->
  <div id="screen-boot" class="screen active">
    <div class="boot-center">
      <div class="wordmark" aria-label="FreezeNova">Freeze<span>Nova</span></div>
      <ol id="boot-steps" class="boot-steps" aria-live="polite"></ol>
      <p id="boot-error" class="boot-error" hidden></p>
      <button id="boot-retry" class="btn-solid" hidden>Try again</button>
    </div>
    <div class="boot-rail" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="boot-fill" class="boot-fill"></div>
    </div>
  </div>

  <!-- Home -->
  <div id="screen-select" class="screen">
    <header class="top-bar">
      <div class="wordmark small">Freeze<span>Nova</span></div>
      <div id="server-status" class="server-pill">
        <span class="status-dot"></span>
        <span id="pill-text">Checking servers</span>
      </div>
    </header>
    <main class="select-main">
      <h1>Play Roblox in your browser.</h1>
      <p class="hero-sub">Runs on our hardware. Nothing to install.</p>
      <div class="section-header">
        <h2>Library</h2>
        <div class="slot-badge"><span id="phones-free">-</span> of <span id="phones-total">-</span> seats open</div>
      </div>
      <div id="game-grid" class="game-grid">
        <button class="game-card" id="play-roblox" type="button">
          <div class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" transform="rotate(12 12 12)"/></svg>
          </div>
          <h3>Roblox</h3>
          <div class="pkg-name">com.roblox.client</div>
          <div class="play-tag">Play now</div>
        </button>
      </div>
    </main>
  </div>

  <!-- Queue -->
  <div id="screen-queue" class="screen">
    <div class="queue-card">
      <p class="queue-label">Your place in line</p>
      <div class="queue-num-wrap"><span id="queue-position" class="queue-num">-</span></div>
      <p class="queue-sub" id="queue-total">Waiting for a seat to open</p>
      <div class="queue-bar-wrap"><div class="queue-bar" id="queue-bar"></div></div>
      <button id="btn-leave-queue" class="btn-ghost" type="button">Leave line</button>
    </div>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen">
    <div class="game-viewport">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="game-overlay" class="game-overlay">
      <div class="wordmark small">Freeze<span>Nova</span></div>
      <div class="load-line"><span></span></div>
      <p>Connecting</p>
    </div>
    <div class="hud">
      <button id="btn-fullscreen" class="hud-btn" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="btn-unblock" class="btn-unblock hud-btn wide" type="button" title="Restart game and stream">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span class="btn-unblock-text">Unblock</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module">
    import { startSession, STEPS } from "./app/js/session.js";
    import { auth } from "./app/js/net.js";

    const list = document.getElementById("boot-steps");
    const fill = document.getElementById("boot-fill");
    const rail = document.querySelector(".boot-rail");
    const errEl = document.getElementById("boot-error");
    const retry = document.getElementById("boot-retry");
    const boot = document.getElementById("screen-boot");

    STEPS.forEach((label) => {
      const li = document.createElement("li");
      li.textContent = label;
      list.appendChild(li);
    });

    // idx = step now running; steps before it are done
    function onStep(idx) {
      [...list.children].forEach((li, i) => {
        li.className = i < idx ? "done" : i === idx ? "active" : "";
      });
      const pct = Math.round((idx / STEPS.length) * 100);
      fill.style.transform = `scaleX(${pct / 100})`;
      rail.setAttribute("aria-valuenow", pct);
    }

    async function run() {
      errEl.hidden = true; retry.hidden = true;
      boot.classList.remove("failed");
      onStep(0);
      try {
        auth.token = await startSession(onStep);
      } catch (e) {
        console.error("Initialization error:", e);
        boot.classList.add("failed");
        errEl.textContent = "Couldn't start a session. Check your connection and try again.";
        errEl.hidden = false; retry.hidden = false;
        return;
      }
      // Load the app only once the session exists, then fade the boot screen out.
      const { App } = await import("./app/js/app.js");
      boot.classList.add("leaving");
      boot.addEventListener("transitionend", () => boot.classList.remove("active", "leaving"), { once: true });
      new App();
    }

    retry.addEventListener("click", run);
    run();
  </script>
</body>
</html>
