<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FreezeNova Cloud Gaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.4.31">
</head>
<body>
  <!-- Animated background -->
  <div class="bg-mesh"></div>

  <!-- Home Screen -->
  <div id="screen-select" class="screen">
    <header class="top-bar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>FreezeNova</span>
      </div>
      <div id="server-status" class="server-pill">
        <span class="pulse-dot"></span>
        <span id="pill-text">Loading...</span>
      </div>
    </header>

    <main class="select-main">
      <section class="hero-section">
        <h1>Play Mobile Games<br><span class="gradient-text">In Your Browser</span></h1>
        <p class="hero-sub">No downloads, no installs.</p>
      </section>

      <section class="games-section">
        <div class="section-header">
          <h2>Games to Play</h2>
          <div id="slot-indicator" class="slot-badge">
            <span id="phones-free">-</span> / <span id="phones-total">-</span> slots available
          </div>
        </div>
        <div id="game-grid" class="game-grid">
          <div class="game-card" id="play-roblox">
            <div class="card-icon">🎮</div>
            <h3>Roblox</h3>
            <div class="pkg-name">com.roblox.client</div>
            <div class="play-tag">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
              Play now
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Queue Screen -->
  <div id="screen-queue" class="screen active">
    <div class="queue-card">
      <div class="spinner-ring"></div>
      <h2>You're in line</h2>
      <div class="queue-num-wrap">
        <span class="queue-hash">#</span>
        <span id="queue-position" class="queue-num">-</span>
      </div>
      <p class="queue-sub" id="queue-total">Waiting for a server to free up...</p>
      <div class="queue-bar-wrap">
        <div class="queue-bar" id="queue-bar"></div>
      </div>
      <button id="btn-leave-queue" class="btn-ghost">Cancel</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="screen-game" class="screen">
    <div class="game-viewport">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="game-overlay" class="game-overlay">
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
      <p>Connecting...</p>
    </div>
    <button id="btn-unblock" class="btn-unblock" title="Restart game &amp; stream">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      <span class="btn-unblock-text">Unblock</span>
    </button>
  </div>

  <script type="module" src="js/app.js?v=1.4.31"></script>
</body>
</html>
